<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background: #f5f6fa; margin: 0; }
    .dashboard-header {
      background: linear-gradient(to right, #140e87, #4a90e2);
      padding: 1rem 2rem; color: #fff;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tabs { display: flex; background: #fde3a7; padding: 0.5rem 2rem; gap: 20px; }
    .tabs button { background: none; border: none; font-size: 1rem; font-weight: 600; color: #140e87; cursor: pointer; }
    .tabs button.active, .tabs button:hover { color: #000; border-bottom: 2px solid #140e87; }
    .tab-content { padding: 2rem; display: none; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); }
    table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    table th { background: #140e87; color: #fff; }
    table tr:hover { background: #f1f1f1; }
    .btn-action { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-right: 5px; }
    .btn-edit { background: #4a90e2; color: #fff; }
    .btn-delete { background: #e74c3c; color: #fff; }
    .btn-create { background: #2ecc71; color: #fff; padding: 8px 14px; margin-top: 1rem; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="dashboard-header">
    <h1>Painel do Administrador</h1>
    <button class="btn btn-light" onclick="logout()">Sair</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-link active" onclick="openTab('users')"><i class="fa fa-users"></i> Usuários</button>
    <button class="tab-link" onclick="openTab('products')"><i class="fa fa-box"></i> Produtos</button>
    <button class="tab-link" onclick="openTab('collections')"><i class="fa fa-layer-group"></i> Coleções</button>
  </div>

  <!-- Usuários -->
  <div id="users" class="tab-content active">
    <h2>Gerenciar Usuários</h2>
    <button class="btn-create" data-bs-toggle="modal" data-bs-target="#modalUser">+ Criar Usuário</button>
    <table>
      <thead><tr><th>ID</th><th>Usuário</th><th>Email</th><th>Ações</th></tr></thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>

  <!-- Produtos -->
  <div id="products" class="tab-content">
    <h2>Gerenciar Produtos</h2>
    <button class="btn-create" data-bs-toggle="modal" data-bs-target="#modalProduct">+ Criar Produto</button>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nome</th><th>Descrição</th><th>Preço</th><th>Estoque</th><th>Imagem</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

  <!-- Coleções -->
  <div id="collections" class="tab-content">
    <h2>Gerenciar Coleções</h2>
    <button class="btn-create" data-bs-toggle="modal" data-bs-target="#modalCollection">+ Criar Coleção</button>
    <table>
      <thead>
        <tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Imagem</th><th>Ações</th></tr>
      </thead>
      <tbody id="collectionTable"></tbody>
    </table>
  </div>

  <!-- ===================== MODAIS ===================== -->

  <!-- Modal Usuário -->
  <div class="modal fade" id="modalUser" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Novo Usuário</h5></div>
      <div class="modal-body">
        <input type="text" id="userName" class="form-control mb-2" placeholder="Usuário">
        <input type="email" id="userEmail" class="form-control mb-2" placeholder="Email">
        <input type="password" id="userPassword" class="form-control mb-2" placeholder="Senha">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="createUser()">Salvar</button>
      </div>
    </div></div>
  </div>

  <!-- Modal Produto -->
  <div class="modal fade" id="modalProduct" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Novo Produto</h5></div>
      <div class="modal-body">
        <input type="text" id="productName" class="form-control mb-2" placeholder="Nome do Produto">
        <textarea id="productDesc" class="form-control mb-2" placeholder="Descrição"></textarea>
        <input type="number" id="productPrice" class="form-control mb-2" placeholder="Preço">
        <input type="number" id="productQty" class="form-control mb-2" placeholder="Quantidade">
        <input type="file" id="productImage" class="form-control mb-2">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="createProduct()">Salvar</button>
      </div>
    </div></div>
  </div>

  <!-- Modal Coleção -->
  <div class="modal fade" id="modalCollection" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Nova Coleção</h5></div>
      <div class="modal-body">
        <input type="text" id="collectionName" class="form-control mb-2" placeholder="Nome da Coleção">
        <textarea id="collectionDesc" class="form-control mb-2" placeholder="Descrição"></textarea>
        <input type="file" id="collectionImage" class="form-control mb-2">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success" onclick="createCollection()">Salvar</button>
      </div>
    </div></div>
  </div>

  <!-- ===================== JS ===================== -->
  <script>
    function openTab(tabId) {
      document.querySelectorAll('.tab-link').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/login';
    }

    // ===== Usuários =====
    async function loadUsers() {
      const res = await fetch('/admin/users');
      const data = await res.json();
      const tbody = document.getElementById("userTable");
      tbody.innerHTML = "";
      data.forEach(u => {
        tbody.innerHTML += `
          <tr>
            <td>${u.id}</td><td>${u.username}</td><td>${u.email}</td>
            <td><button class="btn-action btn-delete" onclick="deleteUser(${u.id})">Excluir</button></td>
          </tr>`;
      });
    }
    async function createUser() {
      const name = document.getElementById("userName").value;
      const email = document.getElementById("userEmail").value;
      const pass = document.getElementById("userPassword").value;
      await fetch("/api/register", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: name, email: email, password: pass })
      });
      loadUsers();
    }
    async function deleteUser(id) {
      await fetch(`/admin/users/${id}`, { method: "DELETE" });
      loadUsers();
    }

    // ===== Produtos =====
    async function loadProducts() {
      const res = await fetch('/admin/products');
      const data = await res.json();
      const tbody = document.getElementById("productTable");
      tbody.innerHTML = "";
      data.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.description || ''}</td>
            <td>R$ ${p.price}</td>
            <td>${p.quantity || 0}</td>
            <td><img src="/static/images/${p.image || 'no-image.png'}" width="60"></td>
            <td><button class="btn-action btn-delete" onclick="deleteProduct(${p.id})">Excluir</button></td>
          </tr>`;
      });
    }
    async function createProduct() {
      const formData = new FormData();
      formData.append("name", document.getElementById("productName").value);
      formData.append("description", document.getElementById("productDesc").value);
      formData.append("price", document.getElementById("productPrice").value);
      formData.append("quantity", document.getElementById("productQty").value);
      const file = document.getElementById("productImage").files[0];
      if (file) formData.append("image", file);

      await fetch("/admin/products", { method: "POST", body: formData });
      loadProducts();
    }
    async function deleteProduct(id) {
      await fetch(`/admin/products/${id}`, { method: "DELETE" });
      loadProducts();
    }

    // ===== Coleções =====
    async function loadCollections() {
      const res = await fetch('/admin/collections');
      const data = await res.json();
      const tbody = document.getElementById("collectionTable");
      tbody.innerHTML = "";
      data.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td>${c.id}</td><td>${c.name}</td><td>${c.description || ''}</td>
            <td><img src="/static/images/${c.image || 'no-image.png'}" width="60"></td>
            <td><button class="btn-action btn-delete" onclick="deleteCollection(${c.id})">Excluir</button></td>
          </tr>`;
      });
    }
    async function createCollection() {
      const formData = new FormData();
      formData.append("name", document.getElementById("collectionName").value);
      formData.append("description", document.getElementById("collectionDesc").value);
      const file = document.getElementById("collectionImage").files[0];
      if (file) formData.append("image", file);

      await fetch("/admin/collections", { method: "POST", body: formData });
      loadCollections();
    }
    async function deleteCollection(id) {
      await fetch(`/admin/collections/${id}`, { method: "DELETE" });
      loadCollections();
    }

    // Carregar ao abrir
    loadUsers();
    loadProducts();
    loadCollections();
  </script>
</body>
</html>
