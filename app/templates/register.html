<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Cadastro</title>
</head>
<body>
  <div class="container">
    <!-- Lado da logo -->
    <div class="logo-side">
      <img src="{{ url_for('static', filename='images/logo-sports.png') }}" alt="Sports Store Logo">
    </div>

    <!-- Lado do formulário -->
    <div class="form-side">
      <form id="registerForm">
        <h2>Criar uma conta</h2>
        <p class="subtitle">Preencha os campos abaixo para se cadastrar</p>

        <input type="text" name="username" placeholder="Usuário" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Senha (mín. 6 caracteres)" required>
        
        <button type="submit">Cadastrar</button>
        <div id="msg"></div>
        
        <a href="/login">Já tem conta? Fazer login</a>
      </form>
    </div>
  </div>

  
<script>
const form = document.getElementById('registerForm');
const msg = document.getElementById('msg');
const btn = form.querySelector("button");

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    username: form.username.value.trim(),
    email: form.email.value.trim(),
    password: form.password.value.trim()
  };

  if(data.password.length < 6){
    msg.style.color = "red";
    msg.textContent = "A senha deve ter pelo menos 6 caracteres.";
    return;
  }

  btn.disabled = true;
  msg.textContent = "Cadastrando...";
  msg.style.color = "black";

  try {
    const res = await fetch('/api/register', {  // 👈 agora chama a API correta
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
    const result = await res.json();

    if(res.ok){
      msg.style.color = "green";
      msg.textContent = result.message;
      setTimeout(() => window.location.href = '/login', 1500);
    } else {
      msg.style.color = "red";
      msg.textContent = result.message || "Erro ao cadastrar.";
    }
  } catch(err){
    msg.style.color = "red";
    msg.textContent = "Erro ao conectar com o servidor.";
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
