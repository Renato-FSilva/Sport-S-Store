<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Login</title>
</head>
<body>
  <div class="container">
    <!-- Lado da logo -->
    <div class="logo-side">
      <img src="{{ url_for('static', filename='images/logo-sports.png') }}" alt="Sports Store Logo">
    </div>

    <!-- Lado do formulário -->
    <div class="form-side">
      <form id="loginForm">
        <h2>Entrar na minha conta</h2>
        <p class="subtitle">Preencha os campos abaixo para acessar sua conta</p>

        <input type="text" name="username" placeholder="Usuário" required>
        <input type="password" name="password" placeholder="Senha" required>

        <button type="submit">Entrar</button>
        <div id="msg"></div>

        <a href="/register">Não tem conta? Criar uma conta</a>
      </form>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const msg  = document.getElementById('msg');
  const btn  = form.querySelector('button');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
      username: form.username.value.trim(),
      password: form.password.value.trim()
    };

    btn.disabled = true;
    msg.textContent = "Entrando...";
    msg.style.color = "black";

    try {
      const res = await fetch('/api/login', {  // <- aqui!
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
      });
      const result = await res.json();

      if (res.ok) {
        // token + flags
        localStorage.setItem('token', result.access_token);
        localStorage.setItem('is_admin', result.is_admin ? '1' : '0');

        // nome vindo do backend (preferível)
        const rawName = (result.username || data.username || '').trim();
        let first = rawName;
        if (first.includes('@')) first = first.split('@')[0];
        first = first.split(/\s+/)[0];
        if (first) first = first.charAt(0).toUpperCase() + first.slice(1);

        localStorage.setItem('username', rawName);
        localStorage.setItem('firstName', first);

        msg.style.color = "green";
        msg.textContent = "Login realizado com sucesso!";

        setTimeout(() => window.location.href = result.redirect, 600);
      } else {
        msg.style.color = "red";
        msg.textContent = result.message || "Erro ao fazer login.";
      }
    } catch (err) {
      msg.style.color = "red";
      msg.textContent = "Erro ao conectar com o servidor.";
    } finally {
      btn.disabled = false;
    }
  });
</script>


</body>
</html>
